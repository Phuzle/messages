name: Release

# Fires when a GitHub Release is published (whether the tag is new or already existed).
# workflow_dispatch is a manual fallback to (re)build and re-attach assets to an existing release
# without needing to delete and republish it (e.g. if the first upload failed).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach assets to"
        required: true

permissions:
  contents: write

jobs:
  # Single job (used to be two — build-and-attach + publish-play-store, each paying for its own
  # checkout/JDK-setup/Gradle-cache-restore from scratch) so the GitHub-release APKs and the
  # Play Store AAB share one checkout, one JDK setup, and one Gradle invocation instead of
  # duplicating all of that twice. The GitHub-release attach step still runs before the Play
  # Store upload, so a Play-side failure (an external service) never loses the already-built and
  # already-attached APKs — it just leaves the Play upload step as the one that needs a rerun.
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: tag
        env:
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
        run: echo "name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      # The app's versionName mirrors the release tag (minus its leading "v"), e.g. tag v1.0.3-beta
      # -> versionName 1.0.3-beta. versionCode must be a strictly increasing integer, which a
      # semver-with-suffix string can't cleanly provide, so it uses this workflow's own run number
      # instead — monotonic for the lifetime of this workflow file, no parsing required.
      - name: Derive app version from tag
        id: version
        env:
          TAG_NAME: ${{ steps.tag.outputs.name }}
        run: |
          echo "name=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # Track is chosen from the tag's suffix (see RELEASING.md): -alpha* -> internal, -beta*/-rc*
      # -> closed testing, anything else (a plain vX.Y.Z) -> open testing. Production is
      # deliberately never selected here — promoting a build to Production stays a manual Play
      # Console step, given the review stakes.
      - name: Determine Play Store track from tag suffix
        id: track
        env:
          TAG_NAME: ${{ steps.tag.outputs.name }}
        run: |
          if [[ "$TAG_NAME" == *-alpha* ]]; then
            echo "name=internal" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG_NAME" == *-beta* || "$TAG_NAME" == *-rc* ]]; then
            # 'alpha' is the API name for the Closed Testing track
            echo "name=alpha" >> "$GITHUB_OUTPUT"
          else
            # 'beta' is the API name for the Open Testing track
            echo "name=beta" >> "$GITHUB_OUTPUT"
          fi

      # Internal track releases can be set to 'completed' immediately (no review gate).
      # Closed and open tracks must use 'draft' while the app is still in draft state
      # on the Play Console; promote them manually once the app is fully published.
      - name: Determine Play Store release status
        id: release_status
        env:
          TRACK: ${{ steps.track.outputs.name }}
        run: |
          if [[ "$TRACK" == "internal" ]]; then
            echo "name=completed" >> "$GITHUB_OUTPUT"
          else
            echo "name=draft" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "${{ runner.temp }}/release.keystore"

      # The google-services Gradle plugin (applied in app/build.gradle.kts) fails the build
      # outright if this file is missing — it's gitignored and never committed, so CI has to
      # reconstitute it from a secret the same way it does the release keystore above.
      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > app/google-services.json

      # One Gradle invocation builds both: assembleRelease (per-ABI + universal APKs, see
      # app/build.gradle.kts's splits.abi — this app has no native code, so these are all
      # functionally identical, just named per the GitHub-release convention below) and
      # bundleRelease (the AAB Play Store requires). Compiling once and packaging twice this way
      # is both simpler and cheaper than the old two-job split, which recompiled from scratch in
      # each job.
      - name: Build signed release APKs and AAB
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease \
            -PreleaseVersionCode=${{ steps.version.outputs.code }} \
            -PreleaseVersionName=${{ steps.version.outputs.name }} \
            --no-daemon

      - name: Rename APKs for the release assets
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p release-assets
          APK_DIR="app/build/outputs/apk/release"
          cp "$APK_DIR/app-arm64-v8a-release.apk" "release-assets/messages-arm64-v8a-v${VERSION}.apk"
          cp "$APK_DIR/app-armeabi-v7a-release.apk" "release-assets/messages-armeabi-v7a-v${VERSION}.apk"
          cp "$APK_DIR/app-x86-release.apk" "release-assets/messages-x86-v${VERSION}.apk"
          cp "$APK_DIR/app-x86_64-release.apk" "release-assets/messages-x86_64-v${VERSION}.apk"
          cp "$APK_DIR/app-universal-release.apk" "release-assets/messages-v${VERSION}.apk"

      - name: Attach APKs to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: release-assets/*.apk

      - name: Write release notes for Play Store
        env:
          RELEASE_BODY: ${{ github.event.release.body || 'See the GitHub release for details.' }}
        run: |
          mkdir -p distribution/whatsnew
          # Play Store caps release notes at 500 characters per locale.
          printf '%s' "$RELEASE_BODY" | head -c 500 > distribution/whatsnew/whatsnew-en-US

      - name: Upload AAB to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.phuzle.labs.messages
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ steps.track.outputs.name }}
          status: ${{ steps.release_status.outputs.name }}
          whatsNewDirectory: distribution/whatsnew
